product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs]

dependencies:
  - //compose-query

  - $compose.foundation: exported
  - $compose.material: exported
  - org.jetbrains.compose.material:material-icons-core:1.7.3

  - $ktor.client.core
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json

dependencies@jvm:
  - $ktor.client.cio

dependencies@android:
  - $ktor.client.cio

dependencies@ios:
  - $ktor.client.cio

dependencies@web:
  - io.ktor:ktor-client-js

settings:
  compose:
    enabled: true
  ktor: enabled
  kotlin:
    serialization: json
