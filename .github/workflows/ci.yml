name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Grant execute permission for kotlin wrapper
      run: chmod +x kotlin
    - name: Build
      run: ./kotlin build
    - name: Test
      run: ./kotlin test
